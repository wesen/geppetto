slug: claude-chat
name: Claude chat completion API flags
description: Settings for the Claude chat completion API
flags:
  - name: claude-top-k
    type: int
    help: Claude top k sampling
    default: 1
  - name: claude-user-id
    type: string
    help: Claude user ID
    default: ""
  - name: claude-base-url
    type: string
    help: base URL
    default: "https://api.anthropic.com/"
  - name: claude-api-key
    type: string
    help: API key
    default: ""
  - name: claude-enable-thinking
    type: bool
    help: Enable Claude 3.7 extended thinking mode
    default: false
  - name: claude-thinking-budget
    type: int
    help: Token budget for Claude extended thinking (min 1024, requires --claude-enable-thinking)
    default: 4096
